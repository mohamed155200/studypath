<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StudyPath</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0d0a22"><meta name="mobile-web-app-capable" content="yes"><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#0d0a22; --bg-2:#141033; --card:rgba(255,255,255,.045);
  --border:rgba(167,139,250,.2); --text:#f3f0ff; --muted:#9a93c4;
  --primary:#7c5cf0; --primary-2:#a78bfa; --teal:#2dd4bf; --blue:#60a5fa;
  --warn:#fb923c; --danger:#f87171; --ok:#4ade80;
  --grad:linear-gradient(135deg,#6d4fe0,#9b7bff);
  --r-sm:10px; --r:16px; --r-lg:22px;
  --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --shadow:0 8px 28px rgba(8,4,30,.45); --glow:0 0 24px rgba(124,92,240,.25);
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font);color:var(--text);min-height:100vh;background:radial-gradient(900px 500px at 80% -10%,#2a1b6b55,transparent),var(--bg)}
.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{background:var(--bg-2);border-inline-end:1px solid var(--border);padding:var(--s5) var(--s4);display:flex;flex-direction:column;gap:var(--s2);position:sticky;top:0;height:100vh}
.brand{font-size:22px;font-weight:700;margin-bottom:var(--s5);display:flex;gap:var(--s2);align-items:center}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;font-style:normal}
.nav a{display:flex;gap:var(--s3);align-items:center;padding:10px var(--s3);border-radius:var(--r-sm);color:var(--muted);text-decoration:none;font-size:15px;transition:.2s}
.nav a:hover{background:var(--card);color:var(--text)}
.nav a.active{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.nav small{display:block;font-size:11px;opacity:.7}
main{padding:var(--s6);max-width:980px;width:100%}
h1{font-size:24px;margin-bottom:4px}.sub{color:var(--muted);font-size:14px;margin-bottom:var(--s5)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s5);box-shadow:var(--shadow);margin-bottom:var(--s4)}
.card.hero{background:linear-gradient(135deg,#2a1b6b66,#16124088)}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s4)}
.btn{background:var(--grad);color:#fff;border:0;border-radius:var(--r);padding:12px 22px;font:inherit;cursor:pointer;text-decoration:none;box-shadow:var(--glow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--s3)}
.tile{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:var(--s4);text-align:center;color:var(--text);text-decoration:none}
.tile:hover{border-color:var(--primary-2)}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--teal) calc(var(--p)*1%),#ffffff14 0)}
.ring div{width:88px;height:88px;border-radius:50%;background:var(--bg-2);display:grid;place-items:center;text-align:center;font-size:22px;font-weight:700}
.ring small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.muted{color:var(--muted);font-size:13px}.empty{text-align:center;padding:var(--s6);color:var(--muted)}
@media(max-width:800px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;overflow-x:auto;z-index:5;padding:var(--s2);border-top:1px solid var(--border)}
  .brand,.nav small{display:none}.nav{display:flex}.nav a{flex-direction:column;font-size:11px;padding:8px}
  main{padding:var(--s4) var(--s4) 96px}
}
.start{min-height:100vh;display:grid;place-items:center;padding:24px}
.start-card{width:100%;max-width:340px;min-height:520px;border-radius:28px;padding:36px 24px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;background:radial-gradient(260px 200px at 50% 70%,#6d4fe055,transparent),linear-gradient(180deg,#1a1342,#0f0b2b);border:1px solid var(--border);box-shadow:var(--shadow),var(--glow)}
.start-card h1{font-size:32px;margin:8px 0 14px;letter-spacing:.3px}
.start-card p{font-size:18px;line-height:1.7;color:var(--text);max-width:230px}
.start-art{width:100%;margin:auto 0 8px}
.dots{display:flex;gap:7px;margin:8px 0 18px}.dots i{width:6px;height:6px;border-radius:50%;background:#ffffff40}.dots i.on{background:#fff}
.start-card .btn{width:100%;font-size:17px;padding:14px;border-radius:999px}
.wiz{width:100%;max-width:340px;min-height:520px;position:relative;border-radius:28px;padding:64px 22px 26px;display:flex;flex-direction:column;background:linear-gradient(180deg,#1a1342,#0f0b2b);border:1px solid var(--border);box-shadow:var(--shadow),var(--glow)}
.back{position:absolute;top:20px;left:20px;background:none;border:0;color:var(--text);font-size:22px;cursor:pointer}
.steps{position:absolute;top:26px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.steps i{width:9px;height:9px;border-radius:50%;background:#ffffff30}.steps i.on{width:34px;border-radius:9px;background:var(--grad)}
.wiz h2{font-size:24px;text-align:center;margin-bottom:10px}.wiz .lead{text-align:center;color:var(--muted);font-size:15px;line-height:1.7;margin-bottom:22px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:right;color:var(--text);font:inherit;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px;cursor:pointer;transition:.2s}
.opt.sel{background:rgba(124,92,240,.2);border-color:var(--primary-2);box-shadow:var(--glow)}
.opt .t{flex:1}.opt b{display:block;font-size:17px;direction:ltr;text-align:right}.opt .m{font-size:14px;color:var(--muted)}.opt .m span{direction:ltr;unicode-bidi:embed}
.opt svg{color:var(--primary-2)}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid #ffffff50;display:grid;place-items:center}
.sel .radio{border-color:var(--primary-2)}.sel .radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--primary-2)}
.wiz .btn{margin-top:auto;width:100%;border-radius:999px;padding:14px;font-size:17px}
.loader{margin:auto;text-align:center;color:var(--muted)}
.spin{width:44px;height:44px;margin:0 auto 14px;border-radius:50%;border:4px solid #ffffff20;border-top-color:var(--primary-2);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.frow label{flex:1;font-size:15px;line-height:1.5}.frow label small{display:block;color:var(--muted);font-size:13px}
.fld{width:150px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 12px;color:var(--text);font:inherit;text-align:center;outline:0}
.fld:focus{border-color:var(--primary-2);box-shadow:var(--glow)}.fld.err{border-color:var(--danger)}
select.fld{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#a78bfa 50%),linear-gradient(135deg,#a78bfa 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
select.fld option{background:#1a1342}
.ctable{border:1px solid var(--border);border-radius:var(--r);background:var(--card);overflow:hidden;margin-bottom:14px}
.chead,.crow{display:grid;grid-template-columns:1fr 60px 92px 32px;align-items:center;gap:6px;padding:8px 12px}
.chead{font-size:12px;color:var(--muted);background:rgba(255,255,255,.04)}.chead span:nth-child(n+2){text-align:center}
.crow{border-top:1px solid var(--border)}
.ci{background:transparent;border:0;color:var(--text);font:inherit;font-size:16px;width:100%;padding:7px 4px;outline:0;border-radius:8px;-moz-appearance:textfield}
.ci::-webkit-inner-spin-button{display:none}.ci.nm{text-align:right}.ci.hrs,.ci.mid{text-align:center}
.ci:focus{background:rgba(255,255,255,.07)}.ci.err{box-shadow:0 0 0 1px var(--danger)}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px;padding:4px}.del:hover{color:var(--danger)}
.add{align-self:flex-start;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:10px 16px;font:inherit;font-size:14px;cursor:pointer}
.add:hover{border-color:var(--primary-2)}
.dash{position:relative;width:100%;max-width:360px;min-height:560px;border-radius:28px;padding:22px 20px 20px;display:flex;flex-direction:column;background:linear-gradient(180deg,#1a1342,#0f0b2b);border:1px solid var(--border);box-shadow:var(--shadow),var(--glow)}
.dtop{display:flex;align-items:flex-start;gap:10px;margin-bottom:18px}
.ic{background:none;border:0;color:var(--text);font-size:20px;cursor:pointer;padding:4px;position:relative;z-index:4}
.dgreet{flex:1}.dgreet h2{font-size:20px}.dgreet p{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.6}
.gcard{display:flex;align-items:center;gap:12px;border-radius:var(--r);padding:16px 18px;margin-bottom:14px;background:linear-gradient(135deg,rgba(124,92,240,.3),rgba(124,92,240,.08));border:1px solid var(--border)}
.gcard .l{flex:1}.gcard .gt{font-size:15px;font-weight:600;margin-bottom:10px}.gcard .gn{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;direction:ltr;justify-content:flex-end}
.gcard .gn svg{color:var(--primary-2)}.gcard .gs{font-size:12.5px;color:var(--muted);margin-top:6px;direction:ltr;text-align:right}
.gcard .ring{width:96px;height:96px}.gcard .ring div{width:76px;height:76px;font-size:20px}
.tcard{display:block;width:100%;font:inherit;color:var(--text);text-align:right;border-radius:var(--r);padding:16px 18px;margin-bottom:14px;cursor:pointer;background:rgba(124,92,240,.14);border:1px solid var(--border)}
.tcard .tl{font-size:15px;font-weight:600;margin-bottom:10px}.tcard .tr{display:flex;align-items:center;gap:12px}
.tcard .tx{flex:1;text-align:center}.tcard .tx b{display:block;font-size:17px;direction:ltr}.tcard .tx span{font-size:13px;color:var(--muted)}
.tcard .pl{width:46px;height:46px;border-radius:50%;background:var(--grad);display:grid;place-items:center;box-shadow:var(--glow)}
.tcard .ch{color:var(--muted);font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:auto}
.tile2{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 2px 10px;font:inherit;font-size:13px;color:var(--text);cursor:pointer;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:14px}
.tile2 svg{color:var(--primary-2)}.tile2:hover{border-color:var(--primary-2)}
.drawer{position:absolute;inset:0;z-index:3;display:none;flex-direction:column;gap:6px;padding:64px 20px 20px;border-radius:28px;background:rgba(12,8,34,.97)}
.drawer.open{display:flex;overflow:auto}
.dnav{background:none;border:0;color:var(--text);font:inherit;font-size:16px;text-align:right;padding:11px 12px;border-radius:12px;cursor:pointer}.dnav:hover{background:var(--card)}
.toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:5;background:#2b2160;border:1px solid var(--border);border-radius:12px;padding:8px 14px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
.pwrap{padding-top:26px}.ptitle{font-size:22px;text-align:right;margin:0 0 18px;padding-left:36px}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--border);margin-bottom:16px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:15px;padding:9px 4px;border-radius:11px;cursor:pointer}
.seg button.on{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.chip{flex:1;min-width:48px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-size:14px;padding:9px 4px;border-radius:999px;cursor:pointer}.chip.on{background:var(--grad);border-color:var(--primary-2);box-shadow:var(--glow)}
.fring{width:190px;height:190px;border-radius:50%;margin:6px auto 16px;display:grid;place-items:center;background:conic-gradient(var(--primary-2) calc(var(--p)*1%),#ffffff14 0)}.fring>div{width:164px;height:164px;border-radius:50%;background:#150f38;display:grid;place-content:center;text-align:center}.fring b{font-size:36px;display:block;direction:ltr}.fring small{color:var(--muted);font-size:13px}
.fctl{display:flex;justify-content:center;align-items:center;gap:18px;margin-bottom:16px;direction:ltr}.fb{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:16px;cursor:pointer}.fb.main{width:56px;height:56px;background:var(--grad);box-shadow:var(--glow);font-size:20px}
.fph.done{opacity:.45}
.srow{display:flex;align-items:center;gap:12px;width:100%;padding:15px 14px;background:none;border:0;border-top:1px solid rgba(167,139,250,.12);color:var(--text);font:inherit;font-size:15px;text-align:right;cursor:pointer}.srow:first-child{border-top:0}.srow b{flex:1;font-weight:500}.srow .ch{color:var(--muted);font-size:18px}
.tg{width:50px;height:28px;border-radius:999px;background:#ffffff30;position:relative;border:0;cursor:pointer;flex:none;direction:ltr}.tg::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--grad)}.tg.on::after{left:25px}
html.light{--bg:#f4f1ff;--bg-2:#fff;--card:rgba(124,92,240,.07);--border:rgba(124,92,240,.28);--text:#1b1740;--muted:#5a5480;--shadow:0 8px 28px rgba(80,60,160,.18);--glow:0 0 18px rgba(124,92,240,.22)}
html.light body{background:radial-gradient(900px 500px at 80% -10%,#d9ceff,transparent),var(--bg)}
html.light .wiz,html.light .start-card{background:linear-gradient(180deg,#fff,#efe9ff)}
html.light .mbox,html.light select.fld option{background:#fff}
html.light .fring>div,html.light .ring div{background:#f4f1ff}
html.light .modal{background:rgba(235,230,255,.93)}
html.light .toast{background:#ece6ff;color:#1b1740}
html.light .sec,html.light .stats,html.light .acard,html.light .seg,html.light .ctable,html.light .prow{background:rgba(124,92,240,.06)}
html.light .tg,html.light .chip{background:rgba(124,92,240,.15)}
html.light .rd{border-color:rgba(124,92,240,.5)}
.wl{display:flex;justify-content:space-between;direction:ltr;font-size:11px;color:var(--muted);margin-top:6px;padding:0 4px}
.wdays{display:flex;gap:4px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}.wdays button{flex:none;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;padding:7px 10px;border-radius:10px;cursor:pointer}.wdays button.on{background:var(--grad);color:#fff}
.wk{border-radius:12px;padding:12px 14px;margin-bottom:10px;border:1px solid;display:flex;flex-direction:column;gap:4px;text-align:right}.wk b{font-size:16px}.wk span{font-size:13px;color:var(--muted);direction:ltr;text-align:right}
.wk.c0{background:rgba(96,165,250,.14);border-color:var(--blue)}.wk.c1{background:rgba(45,212,191,.12);border-color:var(--teal)}.wk.c2{background:rgba(167,139,250,.16);border-color:var(--primary-2)}.wk.c3{background:rgba(251,146,60,.13);border-color:var(--warn)}.fph.cur b,.fph.cur span{color:var(--primary-2)}
.prow{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:10px;border-radius:14px;background:var(--card);border:1px solid var(--border)}
.prow .num{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.07);font-size:15px}
.prow .px{flex:1;text-align:right}.prow .px b{display:block;font-size:16px}.prow .px span{font-size:13px;color:var(--muted)}
.prow.done .px b{text-decoration:line-through;opacity:.55}
.rd{width:26px;height:26px;border-radius:50%;border:2px solid #ffffff55;background:none;cursor:pointer;color:#0d0a22;font-size:15px;line-height:1;display:grid;place-items:center}
.prow.done .rd{background:var(--teal);border-color:var(--teal)}
.pfoot{display:flex;align-items:center;gap:12px;margin-top:auto;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--border);font-size:14px}
.pfoot .bar{flex:1;height:6px;border-radius:6px;background:#ffffff1c;overflow:hidden}.pfoot .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--teal));transition:.3s}
.acard{padding:16px 18px;margin-bottom:16px;border-radius:var(--r);background:rgba(255,255,255,.04);border:1px solid var(--border);text-align:right}
.acard b{display:block;font-size:22px;direction:ltr;text-align:right;margin-bottom:8px}
.bdg{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;background:rgba(74,222,128,.15);color:var(--ok);border:1px solid rgba(74,222,128,.4)}
.ah{font-size:17px;text-align:right;margin:2px 0 12px}
.req{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:10px;border-radius:14px;border:1px solid var(--border);background:var(--card)}
.req .rt{flex:1;text-align:right}.req .rt b{display:block;font-size:16px;direction:ltr;text-align:right}.req .rt span{font-size:13px}
.req .ri{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:#0d0a22}
.req.g{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.5)}.req.g span{color:var(--ok)}.req.g .ri{background:var(--ok)}
.req.o{background:rgba(251,146,60,.1);border-color:rgba(251,146,60,.5)}.req.o span{color:var(--warn)}.req.o .ri{background:var(--warn)}
.req.s{background:rgba(255,255,255,.04)}.req.s span{color:var(--muted)}.req.s .ri{background:#6b6590}
.crs{width:100%;font:inherit;color:var(--text);cursor:pointer}.crs:hover{border-color:var(--primary-2)}.crs .ch{color:var(--muted);font-size:20px}
.ctl{text-align:center;font-size:22px;margin:0 0 18px}
.ecard{display:flex;align-items:center;gap:12px;width:100%;font:inherit;color:var(--text);cursor:pointer;padding:14px 16px;margin-bottom:10px;border-radius:14px;background:var(--card);border:1px solid var(--border);text-align:right}
.ecard:hover{border-color:var(--primary-2)}.ecard .et{flex:1}.ecard b{display:block;font-size:17px;margin-bottom:3px}.ecard small{font-weight:400;color:var(--muted);font-size:12px}
.ecard .ed{display:block;font-size:13.5px;color:#d8d2f5}.ecard .er{display:block;font-size:13.5px;margin-top:2px}.ecard svg{color:var(--primary-2);flex:none}
.wiz .addx{margin-top:auto;font-size:16px;padding:12px}
.atiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.atiles button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px;font:inherit;font-size:12px;color:var(--text);cursor:pointer;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:14px}
.atiles button:hover{border-color:var(--primary-2)}.atiles svg{color:var(--primary-2)}
.modal{display:none;position:absolute;inset:0;z-index:6;align-items:center;justify-content:center;padding:18px;border-radius:28px;background:rgba(10,6,30,.9)}.modal.open{display:flex}
.mbox{width:100%;padding:18px;border-radius:18px;background:#1a1342;border:1px solid var(--border)}.mbox h3{text-align:center;margin-bottom:14px}
.mbox .fld{width:165px}.mrow{display:flex;gap:8px;margin-top:14px}.mrow .btn,.mrow .add{flex:1;margin:0;width:auto;padding:11px;font-size:15px;border-radius:12px;align-self:auto}
.mrow .dng{color:var(--danger);border-color:rgba(248,113,113,.5)}
.acc{display:flex;justify-content:space-between;align-items:center;width:100%;font:inherit;font-size:16px;color:var(--text);padding:13px 16px;margin-bottom:12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--border);cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);padding:12px 4px;margin-bottom:14px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--border);text-align:center}
.stats small{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.stats b{font-size:24px}

<script>// CGPA = (cgpa*H + gpa*h) / (H + h)
const AI_ENDPOINT = ''; // ضع هنا رابط الـ Worker (أو اضبطه من الإعدادات)
if (!(window.claude && typeof window.claude.use === 'function')) {
  const lsGet = (k) => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
  const parseJson = (t) => {
    t = String(t || '').replace(/```json|```/g, '').trim();
    try { return JSON.parse(t); } catch (e) { const m = t.match(/\{[\s\S]*\}/); if (m) return JSON.parse(m[0]); throw new Error('not json'); }
  };
  window.claude = { use: async () => {
    const gKey = lsGet('unitrack:gemini'), url = lsGet('unitrack:ai') || AI_ENDPOINT;
    if (gKey) {
      const model = lsGet('unitrack:gmodel') || 'gemini-flash-latest';
      return { json: async (prompt) => {
        const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-goog-api-key': gKey },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: 'You are a helpful study assistant. Reply with a single valid JSON object only.' }] },
            contents: [{ role: 'user', parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: 'application/json' }
          })
        });
        if (!r.ok) throw new Error('gemini ' + r.status);
        const d = await r.json();
        const parts = (((d.candidates || [])[0] || {}).content || {}).parts || [];
        return parseJson(parts.map((x) => x.text || '').join(''));
      } };
    }
    if (url) {
      return { json: async (prompt) => {
        const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) });
        if (!r.ok) throw new Error('ai ' + r.status);
        return await r.json();
      } };
    }
    return null;
  } };
}

const MAX_GPA = 4;
const newCgpa = (cgpa, H, h, gpa) => (cgpa * H + gpa * h) / (H + h);
const maxPossible = (cgpa, H, h) => newCgpa(cgpa, H, h, MAX_GPA);
const requiredGpa = (cgpa, H, h, target) => (target * (H + h) - cgpa * H) / h;
const isPossible = (cgpa, H, h, target) => requiredGpa(cgpa, H, h, target) <= MAX_GPA;
function semestersNeeded(cgpa, H, h, target, g = MAX_GPA, cap = 12) {
  for (let n = 1; n <= cap; n++) if ((cgpa * H + g * h * n) / (H + h * n) >= target) return n;
  return null;
}

  const tiles = [['focus', 'التركيز', '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>'], ['plan', 'الخطة', '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/>'], ['exams', 'الامتحانات', '<rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/>'], ['courses', 'المواد', '<path d="M12 3 4 7v10l8 4 8-4V7l-8-4ZM4 7l8 4 8-4M12 11v10"/>']];
  return `<div class="start"><div class="dash"><div class="toast" id="toast" role="status" aria-live="polite">لا توجد إشعارات جديدة</div>

   <div class="ring" style="--p:${pct}"><div><span>${s.cgpa.toFixed(2)}<small>CGPA</small></span></div></div></div>
  ${examCard(s)}${assignCard(s)}<button class="tcard" data-go="focus"><div class="tl">مهمة اليوم</div><div class="tr"><span class="ch">›</span><div class="tx"><b>${t.title}</b><span>${t.mins} دقيقة • ${t.note}</span></div><div class="pl"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></div></div></button>

function planScreen(s, tab) {

const lecMins = (p) => Math.max(10, Math.ceil((p * 3) / 5) * 5);
const fmtMin = (m) => (m >= 60 ? `${Math.floor(m / 60)} س${m % 60 ? ` ${m % 60} د` : ''}` : `${m} د`);
async function countPages(f) {
  const ext = f.name.split('.').pop().toLowerCase();
  try {
    if (ext === 'pptx' && window.JSZip) { const z = await JSZip.loadAsync(f); const n = Object.keys(z.files).filter((k) => /^ppt\/slides\/slide\d+\.xml$/.test(k)).length; if (n) return n; }
    if (ext === 'pdf') { const s = new TextDecoder('latin1').decode(await f.arrayBuffer()); const n = (s.match(/\/Type\s*\/Page[^s]/g) || []).length; const c = Math.max(0, ...[...s.matchAll(/\/Count\s+(\d+)/g)].map((m) => +m[1])); if (n || c) return n || c; }
    if (ext === 'txt') return Math.max(1, Math.ceil((await f.text()).length / 1800));
  } catch (e) {}
  return Math.max(1, Math.round(f.size / 60000));
}
function courseShell(name, tab, body) {
  const tabs = [['lec', 'المحاضرات'], ['ai', 'التحليل الذكي'], ['sum', 'المراجعة'], ['sm', 'ملخصات']];

  <div class="seg">${tabs.map(([k, l]) => `<button data-tab="${k}" class="${tab === k ? 'on' : ''}">${l}</button>`).join('')}</div>${body}</div></div>`;
}
async function readLecture(f) {
  const ext = f.name.split('.').pop().toLowerCase(); let text = '', pages = 0;
  try {
    if (ext === 'pptx' && window.JSZip) { const z = await JSZip.loadAsync(f); const ks = Object.keys(z.files).filter((k) => /^ppt\/slides\/slide\d+\.xml$/.test(k)).sort((a, b) => a.match(/\d+/)[0] - b.match(/\d+/)[0]); pages = ks.length; for (const k of ks) { const x = await z.files[k].async('string'); text += [...x.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map((m) => m[1]).join(' ') + '\n'; } }
    else if (ext === 'docx' && window.JSZip) { const z = await JSZip.loadAsync(f); const x = await z.files['word/document.xml'].async('string'); text = [...x.matchAll(/<w:t[^>]*>([^<]*)<\/w:t>/g)].map((m) => m[1]).join(' '); pages = Math.max(1, Math.ceil(text.length / 1800)); }
    else if (ext === 'pdf' && window.pdfjsLib) { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; const d = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise; pages = d.numPages; for (let i = 1; i <= Math.min(pages, 40) && text.length < 8000; i++) { const c = await (await d.getPage(i)).getTextContent(); text += c.items.map((t) => t.str).join(' ') + '\n'; } }
    else if (ext === 'txt') { text = await f.text(); pages = Math.max(1, Math.ceil(text.length / 1800)); }
  } catch (e) {}
  if (!pages) pages = await countPages(f);
  const clean = text.replace(/\s+/g, ' ').trim(); return { pages, digest: clean.slice(0, 3000), full: clean.slice(0, 8000) };
}
function remindTick() {
  const r = state.remind; if (!r || !r.on || !r.time) return;
  const n = new Date(), k = dayKey(n), hm = `${String(n.getHours()).padStart(2, '0')}:${String(n.getMinutes()).padStart(2, '0')}`;

  const t = (state.tasks || [])[0], msg = t ? `حان وقت المذاكرة: ${t.title} (${t.mins} دقيقة)` : 'حان وقت المذاكرة';

  d.onclick = () => d.remove(); document.body.appendChild(d); setTimeout(() => d.remove(), 15000);
  try { if (window.Notification && Notification.permission === 'granted') new Notification(msg); } catch (e) {}
}
async function quizFor(course, i, pre) {
  const l = pre ? { name: 'مراجعة', digest: 'x' } : state.lectures[course][i], w = app.querySelector('.wiz'), e = (t) => String(t).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  const close = () => { const m = document.getElementById('qz'); if (m) m.remove(); };
  const show = (h) => { let m = document.getElementById('qz'); if (!m) { w.insertAdjacentHTML('beforeend', '<div class="modal open" id="qz"></div>'); m = document.getElementById('qz'); } m.innerHTML = `<div class="mbox" style="max-height:100%;overflow:auto">${h}</div>`; };
  const fail = (t) => { show(`<h3>${t}</h3><div class="mrow"><button class="add" id="qx">إغلاق</button></div>`); document.getElementById('qx').onclick = close; };
  if (!l.digest) return fail('مفيش محتوى مقروء من الملف ده، فمش هقدر أعمل منه أسئلة');
  show('<h3>جاري تجهيز الأسئلة…</h3>');
  let qs = pre;
  try {
    if (!qs) {
    qs = localQuiz(l.full || l.digest, 5);
    if (!qs.length) throw 0; }
  } catch (er) { return fail('المحتوى مش كفاية لعمل أسئلة من المحاضرة دي'); }
  let k = 0, score = 0;
  const step = () => {

    app.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => go(b.dataset.go));
    document.getElementById('bell').onclick = () => { const t = document.getElementById('toast'); t.textContent = state.courses.length && Date.now() - state.lastBackup > 14 * 864e5 ? 'عدّى أسبوعين على آخر نسخة احتياطية — صدّر بياناتك من الإعدادات' : 'لا توجد إشعارات جديدة'; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); };
    return;
  }
  const r = routes.find((x) => x.id === id) || routes[0];
  app.innerHTML = `<div class="layout"><aside class="sidebar"><div class="brand"><img src="${LOGO}" width="34" height="34" alt="">StudyPath</div>
    <nav class="nav">${routes.map((x) => `<a href="#/${x.id}" class="${x.id === r.id ? 'active' : ''}"><span>${x.icon}</span><span>${x.ar}<small>${x.en}</small></span></a>`).join('')}</nav></aside>
    <main>${r.render(state)}</main></div>`;
}
document.addEventListener('click', (e) => { const a = e.target.closest('a[href^="#/"]'); if (a) { e.preventDefault(); go(a.getAttribute('href').slice(2)); } });
render();
setInterval(remindTick, 20000);
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('popstate', () => { clearInterval(window.__ft); cur = location.hash.replace('#/', '') || null; render(); });
</script>
</body>
</html>
